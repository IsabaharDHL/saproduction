<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const login = byId('login'), workspace = byId('workspace'), host = byId('frameHost');
  const field = byId('password'), submit = byId('unlock'), error = byId('error');
  const sealed = JSON.parse(byId('sealed').textContent);
  const bytes = text => Uint8Array.from(atob(text), ch => ch.charCodeAt(0));
  let attempt = 0;
  function lock() {
    attempt++;
    host.replaceChildren(); workspace.hidden = true; login.hidden = false;
    field.value = ''; error.hidden = true; submit.disabled = false; submit.textContent = 'دخول';
    field.focus();
  }
  byId('lock').addEventListener('click', lock);
  window.addEventListener('pagehide', lock);
  window.addEventListener('pageshow', event => { if (event.persisted) lock(); });
  byId('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (submit.disabled || !field.value) return;
    if (!window.crypto || !window.crypto.subtle) {
      error.textContent = 'افتح الموقع عبر HTTPS لاستخدام لوحة التحكم.'; error.hidden = false; return;
    }
    const current = ++attempt;
    submit.disabled = true; submit.textContent = 'جارٍ الفتح…'; error.hidden = true;
    let raw = new TextEncoder().encode(field.value); field.value = '';
    try {
      const material = await crypto.subtle.importKey('raw', raw, 'PBKDF2', false, ['deriveKey']);
      raw.fill(0); raw = null;
      const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(sealed.salt),iterations:sealed.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      let plaintext = await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(sealed.iv),additionalData:new TextEncoder().encode('SA-Production/admin/v1'),tagLength:128},key,bytes(sealed.ciphertext));
      if (current !== attempt) {new Uint8Array(plaintext).fill(0);return;}
      const frame = document.createElement('iframe');frame.id = 'adminFrame';frame.title = 'لوحة تحكم S.A Production';
      frame.srcdoc = new TextDecoder('utf-8',{fatal:true}).decode(plaintext);
      new Uint8Array(plaintext).fill(0);plaintext = null;
      host.replaceChildren(frame); login.hidden = true; workspace.hidden = false;
    } catch (_) {
      if (current === attempt) {error.textContent = 'تعذّر فتح اللوحة. تأكد من كلمة المرور.';error.hidden = false;field.focus();}
    } finally {
      if (raw) raw.fill(0);
      if (current === attempt) {submit.disabled = false;submit.textContent = 'دخول';}
    }
  });
})();
</script></body></html>
