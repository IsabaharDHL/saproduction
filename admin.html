<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم S.A Production</title>
<link rel="icon" href="favicon.ico?v=1" sizes="any"><link rel="icon" type="image/png" href="favicon-32.png?v=1" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" sizes="180x180">
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Tahoma,sans-serif}.w{max-width:1050px;width:94%;margin:28px auto}.logo{width:90px}.hidden{display:none!important}.login{max-width:420px;margin:12vh auto;border:1px solid #333;border-radius:18px;background:#101010;padding:28px;text-align:center}.login input,.f input,.f textarea{width:100%;background:#080808;color:#fff;border:1px solid #444;border-radius:9px;padding:12px}.login input{margin:15px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.act{border:1px solid #555;border-radius:22px;padding:10px 16px;background:#111;color:#fff;cursor:pointer}.tabs .on,.primary{background:#fff!important;color:#000!important}.sec{display:none}.sec.on{display:block}.panel,.item{border:1px solid #333;border-radius:15px;background:#101010;padding:22px}.item{margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:block;color:#bbb;font-size:13px;margin-bottom:5px}.f small{display:block;color:#888;margin-top:5px}.f textarea{min-height:78px;resize:vertical}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.danger{background:#3b1515}.videos{margin-top:14px}.vrow{display:flex;gap:8px;margin:7px 0}.vrow input{flex:1}.preview{display:block;width:110px;height:90px;object-fit:cover;border-radius:9px;margin-top:8px;border:1px solid #444}.focusPreview{width:220px;height:160px;cursor:crosshair}.detailPreview{width:min(420px,100%);height:140px}.status{min-height:22px;color:#9bd6a7}.error{color:#ff9b9b}.topActions{display:flex;gap:8px;flex-wrap:wrap}.savebar{position:sticky;bottom:12px;z-index:20;margin-top:22px;padding:12px;background:#111e;border:1px solid #444;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.passwordBox{margin-top:18px}.passwordBox .grid{grid-template-columns:repeat(3,1fr)}@media(max-width:700px){.grid,.passwordBox .grid{grid-template-columns:1fr}.head{align-items:flex-start}.savebar{flex-direction:column}.savebar .act{width:100%}}
</style></head><body>
<main id="loginView" class="login"><img src="logo-white.png" class="logo" alt="S.A Production"><h1>لوحة التحكم</h1><p>أدخل كلمة المرور</p><input id="loginPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="loginButton" class="act primary">دخول</button><p id="loginStatus" class="error" aria-live="polite"></p></main>
<main id="adminView" class="w hidden"><div class="head"><div><img src="logo-white.png" class="logo" alt="S.A Production"><h1>لوحة تحكم S.A Production</h1></div><div class="topActions"><button id="importOld" class="act hidden">استيراد التعديلات القديمة من هذا الجهاز</button><button id="logoutButton" class="act">تسجيل الخروج</button></div></div>
<div class="tabs"><button class="on" data-id="site">الموقع</button><button data-id="artists">الفنانين</button><button data-id="offers">العروض</button><button data-id="about">نبذة عنا</button><button data-id="password">تغيير كلمة المرور</button></div>
<section class="sec on" id="site"><div class="panel"><h2>إعدادات الموقع</h2><div class="grid"><div class="f"><label for="bannerTitleAr">عنوان البانر بالعربي</label><input id="bannerTitleAr"></div><div class="f"><label for="bannerTitleEn">Banner title in English</label><input id="bannerTitleEn"></div><div class="f"><label for="whatsapp">رقم واتساب</label><input id="whatsapp" inputmode="tel"></div><div class="f"><label for="bannerFile">صورة البانر الرئيسية</label><input id="bannerFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><img id="bannerPreview" class="preview hidden" alt="معاينة صورة البانر"><small>JPG أو PNG أو WebP أو GIF، بحد أقصى 8 MB.</small></div></div></div></section>
<section class="sec" id="artists"><div class="panel"><div class="head"><h2>إدارة الفنانين</h2><button id="addArtist" class="act primary">+ إضافة فنان</button></div><div id="alist"></div></div></section>
<section class="sec" id="offers"><div class="panel"><div class="head"><h2>إدارة العروض</h2><button id="addOffer" class="act primary">+ إضافة عرض</button></div><div id="olist"></div></div></section>
<section class="sec" id="about"><div class="panel"><h2>نبذة عنا</h2><div class="grid"><div class="f"><label for="aboutAr">النبذة بالعربي</label><textarea id="aboutAr"></textarea></div><div class="f"><label for="aboutEn">About Us in English</label><textarea id="aboutEn"></textarea></div></div></div></section>
<section class="sec" id="password"><div class="panel passwordBox"><h2>تغيير كلمة المرور</h2><div class="grid"><div class="f"><label for="currentPassword">كلمة المرور الحالية</label><input id="currentPassword" type="password" autocomplete="current-password"></div><div class="f"><label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password"></div><div class="f"><label for="confirmPassword">تأكيد كلمة المرور الجديدة</label><input id="confirmPassword" type="password" autocomplete="new-password"></div></div><br><button id="changePassword" class="act primary">تغيير كلمة المرور</button><p id="passwordStatus" aria-live="polite"></p></div></section>
<div class="savebar"><span id="saveStatus" class="status" aria-live="polite">أي تعديل لن يظهر للزوار إلا بعد الضغط على الحفظ.</span><button id="saveButton" class="act primary">حفظ التغييرات ونشرها</button></div></main>
<script src="i18n.js"></script><script type="module" src="admin.js"></script></body></html>
